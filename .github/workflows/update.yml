name: Update the index

on:
  schedule:
    - cron: "40 9 * * *"   # daily, after the index is computed (about 08:25 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull today's index
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Index through $(python -c 'import json;print(json.load(open("data/latest.json"))["data_through"])')"
            git push
          else
            echo "No change today."
          fi
